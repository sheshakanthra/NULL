name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Determinism belt-and-braces. Contract-level float quantisation is the real
  # defence (see null/contracts.py); pinning thread counts stops BLAS from
  # reassociating reductions differently run to run on top of that.
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  no-llm:
    # CLAUDE.md invariant 1. Its own job so a violation is unmissable in the
    # checks list rather than buried in a test summary.
    name: no LLM in null/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: no-LLM grep test
        run: pytest tests/unit/test_no_llm.py -v
      - name: other source invariants (network, credentials, wall-clock)
        run: pytest tests/unit/test_source_invariants.py -v

  runtime-deps:
    # Installs the package with NO dev extras, then imports every module and runs
    # the CLI. A missing RUNTIME dependency fails here, on the commit that
    # introduced it, rather than several commits later when a test happens to touch
    # the code path.
    #
    # This job exists because pyarrow went undeclared for three commits: the TRI
    # loader needed it, every test touching parquet was skipped for missing data,
    # and CI stayed green until the OHLCV loader wrote an actual file.
    name: runtime deps only (no dev extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - name: install runtime dependencies only
        run: pip install .
      - name: import every module and probe parquet
        # From /tmp so the installed package is imported, not the source tree.
        working-directory: /tmp
        run: python $GITHUB_WORKSPACE/scripts/check_runtime_deps.py
      - name: the CLI runs
        working-directory: /tmp
        run: null --version

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy --strict null/

  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -v

  determinism:
    # Scaffold for the M5 cross-machine check. Today it proves the pinned golden
    # hash is identical on Linux, macOS and Windows; M5 extends it to the full
    # verdict.json artifact.
    name: golden hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_determinism.py -v
